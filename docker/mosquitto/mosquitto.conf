# Yerel MQTT broker (sabit sis düğümü)
listener 1883
allow_anonymous true
persistence false
log_dest stdout

# Wokwi köprüsü: Wokwi'deki kapı okuyucusu gösterimde genel test broker'ına yazar.
# Bu köprü o konuları yerel broker'a çeker ("in"); yerel veri dışarı gönderilmez.
connection wokwi-kopru
address test.mosquitto.org:1883
topic bis505-suru/agil1/# in 0
cleansession true
start_type automatic
notifications false
try_private false
