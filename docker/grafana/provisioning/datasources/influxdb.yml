apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx-suru
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: bulut
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
